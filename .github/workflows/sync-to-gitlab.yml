name: Sync to GitLab

# Copies GitHub's branches and tags to gitlab.com/mooring_corp/mooric_website so
# the two stay the same. Local pushes already go to both remotes; this catches
# what happens on github.com itself (merging a PR, editing a file, deleting a
# branch).
#
# Credentials, in order of preference:
# - GITLAB_DEPLOY_KEY: the private half of an SSH deploy key that has write
#   access to mooric_website only. Nothing else on GitLab can be reached with it.
# - GITLAB_TOKEN: a personal access token (write_repository). It works for every
#   project its owner can push to, so it is only a fallback; delete it once the
#   deploy key works.
on:
  push:
  delete:
  schedule:
    # Pushes to branches without this file don't trigger it; this catches them.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitlab-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Push to GitLab
        env:
          GITLAB_DEPLOY_KEY: ${{ secrets.GITLAB_DEPLOY_KEY }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITHUB_READ_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.event.ref_type }}
          REF: ${{ github.event.ref }}
        run: |
          set -euo pipefail
          if [ -n "$GITLAB_DEPLOY_KEY" ]; then
            install -d -m 700 ~/.ssh
            printf '%s\n' "$GITLAB_DEPLOY_KEY" > ~/.ssh/gitlab_deploy
            chmod 600 ~/.ssh/gitlab_deploy
            # GitLab.com's published ED25519 host key
            # (SHA256:eUXGGm1YGsMAS7vkcx6JOJdOGHPem5gQp4taiCfCLB8)
            echo "gitlab.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAfuCHKVTjquxvt6CM6tdG4SLp1Btn/nOeHHE5UOzRdf" > ~/.ssh/known_hosts
            export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/gitlab_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
            gitlab="git@gitlab.com:mooring_corp/mooric_website.git"
            echo "Using the deploy key"
          elif [ -n "$GITLAB_TOKEN" ]; then
            gitlab="https://oauth2:${GITLAB_TOKEN}@gitlab.com/mooring_corp/mooric_website.git"
            echo "::warning::Using GITLAB_TOKEN; switch to GITLAB_DEPLOY_KEY (see the README)"
          else
            echo "::error::Set the GITLAB_DEPLOY_KEY secret"
            exit 1
          fi

          if [ "$EVENT" = "delete" ]; then
            if [ "$REF_TYPE" = "tag" ]; then dest="refs/tags/$REF"; else dest="refs/heads/$REF"; fi
            git init -q empty && cd empty  # git push needs a repo, even to delete
            if git ls-remote --exit-code "$gitlab" "$dest" >/dev/null; then
              git push "$gitlab" --delete "$dest"
            else
              echo "$dest is already gone on GitLab"
            fi
            exit 0
          fi

          git clone --quiet --bare \
            "https://x-access-token:${GITHUB_READ_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo.git
          cd repo.git
          # No --force and no --prune: a branch that went a different way on
          # GitLab fails here, loudly, instead of being overwritten, and
          # branches that exist only on GitLab are left alone.
          git push "$gitlab" 'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'
